<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div id="main_grid">
        <div id="header">
            <div style="display: flex;" >
                <div>
                    <h1 id="user_name_label" style="margin: 0px;">noname</h1>
                    <div id="status" style="display: flex; align-items: center;">
                        <div id="circle" style="background: lightcoral;" ></div>
                        <h2 style="margin: 0px; margin-left: 4px;">Offline</h2>
                    </div>
                </div>
                <!-- <button style="margin-left: 20px;" onclick="toggle_users_list()" >list users</button> -->
            </div>
            <div style="display: flex; align-items: center;" >
                <span id="settings-button" class="material-symbols-outlined" onclick="toggle_settings()">
                    settings
                </span>
            </div>
        </div>
        <div id="chat" style="color: darkgray;">
            <div style="height: 100%;" ></div>
            <!-- <div class="message">
                <div class="user_label">
                    <h2 class="user_name">User</h2>
                    <h3 class="message_time">10:38:07</h3>
                </div>
                <h2 class="message_text">test long message to display</h2>
            </div> -->
        </div>
        <div id="footer">
            <textarea name="message_text" id="message_text"></textarea>
            <button onclick="send_message()">></button>
        </div>
    </div>

    <div id="settings-menu" class="menu" >
        <button style="position: absolute; top: 0; right: 0;" onclick="toggle_settings()">close</button>
        <h1 style="margin: 0px;">Settings:</h1>
        <div class="vr" ></div>
        <div class="setting">
            <p class="setting-name" >user name:</p>
            <textarea name="user_name_input" id="user_name_input"></textarea>
            <button onclick="set_user_name()" >set</button>
        </div>
    </div>

    <div id="users_list" class="menu" >
        <button style="position: absolute; top: 0; right: 0;" onclick="toggle_users_list()">close</button>
        <button style="position: absolute; top: 0; left: 0;" onclick="create_user_list_table()">fetch</button>
        <h1 style="margin: 0px;">Users:</h1>
        <div class="vr" ></div>
        <div id="user_list_table_holder" style="max-height: 65vh; overflow-y: scroll;"></div>
    </div>


</body>

<script>
    const wsUrl = new URL(document.location);
    wsUrl.protocol = wsUrl.protocol === 'https:' ? 'wss:' : 'ws:';
    wsUrl.pathname = '/ws';

    let ws;
    let reconnectTimeout;

    let user_name = "noname";
    let is_settings_menu_open = false;
    let is_user_list_open = false;
    let auto_scroll = true;

    
    const [status_light, status_text] = document.getElementById("status").children;
    const textarea = document.getElementById("message_text");
    const user_name_input = document.getElementById("user_name_input");
    const chat = document.getElementById("chat");
    
    textarea.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            send_message();
        }
    });

    user_name_input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            set_user_name();
        }
    });

    chat.addEventListener("scrollend", (event) => {
        console.log(event);
        if (chat.scrollTop >= chat.scrollTopMax - 30) {
            auto_scroll = true;
        } else {
            auto_scroll = false;
        }
    });

    function send_message() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            let message = {user: user_name, text: textarea.value};
            textarea.value = "";
            ws.send(JSON.stringify(message));
        } else {
            alert("Cannot send message: you are offline.");
        }
    }


    function connect_to_websocket() {
        clearTimeout(reconnectTimeout);

        ws = new WebSocket(wsUrl.href);

        ws.addEventListener('open', () => {
            console.log('Successfully connected to the WebSocket server!');
            status_light.style.background = "lightgreen";
            status_text.textContent = "Online";
        });

        ws.addEventListener('close', () => {
            console.log('Disconnected from the server. Attempting to reconnect');
            status_light.style.background = "lightcoral";
            status_text.textContent = "Offline";
            reconnectTimeout = setTimeout(connect_to_websocket, 1000);
        });

        ws.addEventListener("message", (socket_message) => {
            let message = JSON.parse(socket_message.data);
            add_new_message(message);
            if (auto_scroll) {
                scroll_to_end();
            }
            console.log(message.text)
        });

        ws.addEventListener('error', (error) => {
            console.error('WebSocket Error: ', error);
        });
    }

    function add_new_message(message) {
        let message_holder = document.createElement("div");
        message_holder.className = "message";

            let user_label = document.createElement("div");
            user_label.className = "user_label"

                let user_name_label = document.createElement("h2");
                user_name_label.textContent = message.user;
                user_name_label.className = "user_name";

                    let user_id_label = document.createElement("span");
                    user_id_label.textContent = "#" + message.user_id;
                    user_id_label.className = "user_id";
                
                user_name_label.appendChild(user_id_label);
                
                let message_time_label = document.createElement("h3");
                message_time_label.textContent = message.time;
                message_time_label.className = "message_time";
            
            user_label.appendChild(user_name_label);
            user_label.appendChild(message_time_label);

            let message_text_holder = document.createElement("div");

            let message_text = message.text;
            let regex = /(img<.*?>)/;
            let text_parts = message_text.split(regex);

            for (let element_i = 0; element_i < text_parts.length; element_i++) {
                let element;
                let element_text = text_parts[element_i];

                if (regex.test(element_text)) {
                    element = document.createElement("img");
                    element.style = "height: 150px;";
                    element.src = element_text.substring(4,element_text.length-1)
                } else {
                    element = document.createElement("h2");
                    element.textContent = element_text;
                }

                message_text_holder.appendChild(element);
                message_text_holder.className = "message_text"
                
            }
        
        message_holder.appendChild(user_label);
        message_holder.appendChild(message_text_holder);

        document.getElementById("chat").appendChild(message_holder);
    }

    function scroll_to_end() {
        chat.scrollTo({
            top: chat.scrollHeight,
            behavior: 'smooth'
        });
    }

    function toggle_settings() {
        let settings_menu = document.getElementById("settings-menu");
        is_settings_menu_open = toggle_menu(is_settings_menu_open, settings_menu);
    }

    function toggle_users_list() {
        let users_list = document.getElementById("users_list");
        is_user_list_open = toggle_menu(is_user_list_open, users_list);
    }

    function toggle_menu(menu_status, menu_element) {
        if (menu_status) {
            menu_element.style.transform = "translate(-50%, -200vh)";
        } else {
            menu_element.style.transform = "translate(-50%, -50%)";
        }
        return !menu_status;
    }

    function set_user_name() {
        let user_name_label= document.getElementById("user_name_label");
        user_name = user_name_input.value;
        user_name_label.textContent = user_name;

    }

    // function create_user_list_table() {
    //     let table_holder = document.getElementById("user_list_table_holder");

    //         let table = document.createElement("table");
    //         table.style = "padding: 20px;"
    //             for (let i = 0; i < 10; i++) {
    //                 let cell = document.createElement("tr");
    //                     let text = document.createElement("p");
    //                     text.textContent = "test1";
    //                 cell.appendChild(text);
    //                 table.appendChild(cell);
    //             }
            

    //     table_holder.append(table);
    // }

    connect_to_websocket();
</script>

</html>
